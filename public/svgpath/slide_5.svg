<svg class="w-full h-full" viewBox="0 0 400 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb800" />
      <stop offset="100%" stop-color="#ff5c00" />
    </linearGradient>
  </defs>

  <!-- Background clean sky -->
  <rect x="50" y="15" width="300" height="150" rx="20" fill="url(#skyGrad)" opacity="0.5" />

  <!-- Rising Sun -->
  <circle cx="200" cy="95" r="24" fill="url(#sunGrad)" />
  <circle cx="200" cy="95" r="32" stroke="#ffb800" stroke-width="0.5" stroke-dasharray="3 3" opacity="0.5" />

  <!-- Clean hills / backwaters silhouette -->
  <path d="M 50 145 Q 120 120 200 135 T 350 120 L 350 165 L 50 165 Z" fill="#1b4332" opacity="0.9" />
  <path d="M 50 155 Q 150 145 230 152 T 350 148 L 350 165 L 50 165 Z" fill="#2d6a4f" />

  <!-- Coconut Palms (Right side) -->
  <g transform="translate(290, 80)">
    <!-- Trunk -->
    <path d="M 15 85 Q 12 45 3 5" stroke="#fff" stroke-width="2.5" fill="none" />
    <!-- Leaves -->
    <path d="M 3 5 Q -15 0 -25 15 M 3 5 Q -10 -15 3 -25 M 3 5 Q 20 -10 32 5 M 3 5 Q 15 15 20 30 M 3 5 Q -5 20 -12 35" stroke="#22c55e" stroke-width="1.5" fill="none" />
  </g>

  <!-- Coconut Palms (Left side) -->
  <g transform="translate(90, 85)">
    <!-- Trunk -->
    <path d="M -5 80 Q -1 40 5 5" stroke="#fff" stroke-width="2" fill="none" />
    <!-- Leaves -->
    <path d="M 5 5 Q 20 0 28 12 M 5 5 Q 15 -12 5 -22 M 5 5 Q -10 -8 -20 5 M 5 5 Q -8 12 -12 25" stroke="#22c55e" stroke-width="1.2" fill="none" />
  </g>

  <!-- Sparkles / clean air elements -->
  <g>
    <!-- Sparkle 1 -->
    <path d="M 150 50 L 152 55 L 157 57 L 152 59 L 150 64 L 148 59 L 143 57 L 148 55 Z" fill="#fff" opacity="0.8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" />
    </path>
    <!-- Sparkle 2 -->
    <path d="M 240 40 L 241 43 L 244 44 L 241 45 L 240 48 L 239 45 L 236 44 L 239 43 Z" fill="#fff" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.5s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Motivational text banner "GOD'S OWN COUNTRY" -->
  <rect x="130" y="115" width="140" height="18" rx="9" fill="rgba(0, 0, 0, 0.6)" stroke="#00f0ff" stroke-width="0.8" class="backdrop-blur-sm" />
  <text x="200" y="127" fill="#00f0ff" font-size="7" font-family="monospace" font-weight="bold" text-anchor="middle" letter-spacing="1.5">GOD'S OWN COUNTRY</text>
</svg>
